<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan creatures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ocean: #121212;
        --win: #f6f6f5;
        --panel: #ffffff;
        --row: #f3f3f2;
        --line: #ebebea;
        --text: #141414;
        --dim: #8b8b89;
        --radius: 22px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--ocean); color: var(--text); font: 13px/1.3 "Geist", system-ui, sans-serif; overflow: hidden; }
      button { font: inherit; color: inherit; }

      /* ── ocean ── */
      .ocean { position: fixed; inset: 0; }
      .ocean canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ocean::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }

      /* ── window ── */
      .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 64px 120px; pointer-events: none; }
      .win { pointer-events: auto; width: min(1120px, 100%); height: min(700px, 100%); background: var(--win); border-radius: var(--radius);
        padding: 10px; display: grid; grid-template-columns: 262px 1fr 248px; gap: 10px;
        box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
      .col { background: transparent; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
      .group { background: var(--panel); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 0 0 1px var(--line) inset; }
      .group.grow { flex: 1; overflow: auto; }
      .group::-webkit-scrollbar { width: 0; }

      .pill { display: grid; grid-template-columns: 22px auto 1fr; align-items: center; gap: 8px; background: var(--row); border-radius: 11px; padding: 0 10px; height: 40px; }
      .pill .ic { width: 18px; height: 18px; color: #6f6f6d; display: grid; place-items: center; }
      .pill .ic svg { width: 16px; height: 16px; }
      .pill .lb { font-weight: 500; white-space: nowrap; }
      .pill .ctl { justify-self: end; display: flex; align-items: center; gap: 8px; min-width: 0; }
      .pill .val { font: 500 11px "Geist Mono", monospace; color: #555; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
      .pill input[type=range] { width: 92px; accent-color: #1f6feb; height: 14px; }
      .chip { background: #fff; border: 1px solid #e3e3e1; border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
      .chip:hover { border-color: #cfcfcd; }

      .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--row); border-radius: 11px; padding: 3px; gap: 3px; }
      .seg button { border: 0; background: transparent; border-radius: 8px; height: 34px; cursor: pointer; font-weight: 500; color: #6b6b69; }
      .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px #e6e6e4; }

      .toggle { width: 30px; height: 18px; border-radius: 99px; background: #d9d9d7; position: relative; cursor: pointer; border: 0; padding: 0; transition: background .15s; }
      .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
      .toggle.on { background: #1f6feb; }
      .toggle.on::after { transform: translateX(12px); }

      .swatches { display: flex; gap: 4px; }
      .swatches button { width: 16px; height: 16px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
      .swatches button.on { outline: 2px solid #1f6feb; outline-offset: 1px; }
      .swatches label { width: 16px; height: 16px; border-radius: 6px; border: 1px dashed #bbb; display: grid; place-items: center; font-size: 11px; color: #888; cursor: pointer; position: relative; overflow: hidden; }
      .swatches input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
      .colorbox { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); position: relative; overflow: hidden; }
      .colorbox input { position: absolute; inset: -4px; width: 40px; height: 40px; opacity: 0; cursor: pointer; }

      /* ── preview ── */
      .preview { background: var(--row); border-radius: 16px; position: relative; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1px var(--line) inset; }
      .preview .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); background-size: 18px 18px; }
      .card { position: relative; width: min(680px, calc(100% - 48px)); height: 236px; container-type: inline-size; border-radius: 16px; overflow: hidden; display: flex; align-items: center;
        box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.08); transition: background .2s; margin-bottom: 40px; }
      /* Sized to the copy: the title stays on one line, the sentence wraps in two even lines. */
      .card .copy { position: relative; z-index: 1; padding: 26px 28px; flex: 0 0 auto; width: 340px; max-width: 62%; }
      .card h3 { margin: 0 0 10px; font-weight: 400; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
      .card h3 b { font-weight: 600; }
      .card p { margin: 0 0 16px; color: #8a8a88; font-size: 13.5px; line-height: 1.5; text-wrap: pretty; }
      @container (max-width: 520px) {
        .card .copy { width: auto; max-width: 64%; padding: 22px; }
        .card h3 { white-space: normal; font-size: 16px; }
      }
      .card p a { color: inherit; text-decoration: none; font-weight: 500; filter: brightness(.55); }
      .card .btn { background: #fff; border: 1px solid #e2e2e0; border-radius: 9px; padding: 9px 15px; font-size: 14px; color: #141414; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
      .card.dark h3 { color: #f1f1f0; }
      .card.dark p { color: #9aa3ad; }
      .card.dark p a { filter: none; color: #f1f1f0; }
      .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .card .x { position: absolute; top: 16px; right: 16px; z-index: 2; width: 30px; height: 30px; border-radius: 8px; background: #fff; border: 1px solid #e6e6e4;
        display: grid; place-items: center; font-size: 15px; color: #333; }

      .toolbar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: #fff;
        border-radius: 13px; padding: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
      .toolbar .name { background: var(--row); border-radius: 9px; padding: 0 12px; height: 32px; display: flex; align-items: center; min-width: 150px; font-weight: 500; margin-right: 6px; white-space: nowrap; }
      .toolbar .ib { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: #333; }
      .toolbar .ib:hover { background: var(--row); }
      .toolbar .ib:disabled { color: #c4c4c2; cursor: default; background: transparent; }
      .toolbar .ib svg { width: 16px; height: 16px; }
      .toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
      .toolbar .export { background: #141414; color: #fff; border: 0; border-radius: 9px; height: 32px; padding: 0 13px; font-weight: 500; cursor: pointer; margin-left: 4px; }
      .menu { position: absolute; bottom: 48px; right: 0; background: #fff; border-radius: 11px; padding: 5px; min-width: 150px; display: none;
        box-shadow: 0 10px 30px rgba(0,0,0,.14), 0 0 0 1px var(--line); }
      .menu.open { display: block; }
      .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
      .menu button:hover { background: var(--row); }

      /* ── looks ── */
      .looks { background: var(--panel); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 0 0 1px var(--line) inset; overflow: hidden; }
      .grid { flex: 1; overflow: auto; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-content: start; }
      .grid::-webkit-scrollbar { width: 0; }
      .tile { position: relative; aspect-ratio: 1.45; border-radius: 10px; overflow: hidden; cursor: pointer; border: 0; padding: 0; outline: 2px solid transparent; outline-offset: 1px; }
      .tile.on { outline-color: #141414; }
      .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .tile span { position: absolute; left: 7px; bottom: 6px; color: #fff; font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.45);
        background: rgba(0,0,0,.28); padding: 2px 6px; border-radius: 5px; backdrop-filter: blur(4px); }
      .empty { grid-column: 1 / -1; color: var(--dim); text-align: center; padding: 30px 10px; line-height: 1.5; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 6px; gap: 4px; border-top: 1px solid var(--line); }
      .tabs button { border: 0; background: transparent; border-radius: 9px; height: 34px; cursor: pointer; color: #6b6b69; font-weight: 500; }
      .tabs button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px #e6e6e4; }

      .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #141414; color: #fff; padding: 8px 13px; border-radius: 9px;
        opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
      .toast.on { opacity: 1; }

      @media (max-width: 1080px) {
        .win { grid-template-columns: 250px 1fr; }
        .looks { display: none; }
      }
      @media (max-width: 760px) {
        body { overflow: auto; }
        .stage { position: relative; padding: 16px; }
        .win { grid-template-columns: 1fr; height: auto; }
        .preview { min-height: 360px; }
      }
    </style>
  </head>
  <body>
    <div class="ocean" id="ocean"></div>

    <div class="stage">
      <div class="win">
        <!-- controls -->
        <div class="col">
          <div class="group">
            <div class="seg" id="plans"></div>
          </div>
          <div class="group grow" id="controls"></div>
        </div>

        <!-- preview -->
        <div class="preview">
          <div class="dots"></div>
          <section class="card" id="card">
            <div class="copy">
              <h3 id="cardTitle"></h3>
              <p id="cardText"></p>
              <button class="btn" id="cardBtn"></button>
            </div>
            <canvas aria-hidden="true"></canvas>
            <div class="x">×</div>
          </section>
          <div class="toolbar">
            <div class="name" id="name"></div>
            <button class="ib" id="fav" title="Save to favorites"></button>
            <button class="ib" id="gridBtn" title="Toggle grid"></button>
            <span class="sep"></span>
            <button class="ib" id="undo" title="Undo"></button>
            <button class="ib" id="redo" title="Redo"></button>
            <button class="ib" id="play" title="Pause / play"></button>
            <div style="position: relative">
              <button class="export" id="export">Export</button>
              <div class="menu" id="menu">
                <button data-act="link">Copy link</button>
                <button data-act="json">Copy JSON</button>
                <button data-act="reset">Reset all plans</button>
              </div>
            </div>
          </div>
        </div>

        <!-- looks -->
        <div class="looks">
          <div class="grid" id="looks"></div>
          <div class="tabs" id="lookTabs">
            <button class="on" data-tab="looks">Looks</button>
            <button data-tab="favs">Favorites</button>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="/creatures.ts"></script>
  </body>
</html>
